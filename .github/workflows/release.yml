name: Release

# Push a tag like v0.1.0 to build, publish to PyPI (trusted publishing, no
# token needed) and create the GitHub release.
on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Check that the tag matches the package version
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          test "v$version" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != v$version"; exit 1; }
      - name: Point the README's relative links at this tag (for PyPI)
        run: |
          base="https://github.com/${GITHUB_REPOSITORY}"
          raw="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_REF_NAME}"
          sed -i -E \
            -e "s#(src=\")(assets/)#\1${raw}/\2#g" \
            -e "s#(href=\")((examples|docs|benchmarks|voltax)/|LICENSE|CHANGELOG)#\1${base}/blob/${GITHUB_REF_NAME}/\2#g" \
            -e "s#\]\(((examples|docs|benchmarks|voltax)/[^)]*|LICENSE|CHANGELOG.md)\)#](${base}/blob/${GITHUB_REF_NAME}/\1)#g" \
            README.md
      - run: uv build
      - run: uvx twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/voltax
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: astral-sh/setup-uv@v6
      - run: uv publish --trusted-publishing always

  github-release:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create the release with the changelog entry as notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$0 ~ "^## \\[?"v {f=1; next} /^## / && f {exit} f' CHANGELOG.md > notes.md
          gh release create "${GITHUB_REF_NAME}" dist/* --title "${GITHUB_REF_NAME}" --notes-file notes.md
